<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff4438">
  <title>Timio — нет соединения</title>
  <style>
    :root { color-scheme: light dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fafafa; color: #18181b; }
    main { width: min(420px, calc(100% - 40px)); text-align: center; }
    .mark { width: 56px; height: 56px; margin: 0 auto 24px; display:grid; place-items:center; border-radius: 16px; background:#ff4438; color:#fff; font-weight:900; font-size:26px; }
    h1 { margin:0 0 10px; font-size:24px; }
    p { margin:0 0 24px; color:#71717a; line-height:1.55; }
    button { border:0; border-radius:10px; padding:13px 18px; background:#ff4438; color:white; font-weight:700; font-size:15px; cursor:pointer; }
    @media (prefers-color-scheme: dark) { body { background:#0b0b0c; color:#f4f4f5; } p { color:#a1a1aa; } }
  </style>
</head>
<body>
  <main>
    <div class="mark">T</div>
    <h1>Нет соединения</h1>
    <p>Timio не может связаться с сервером. Проверьте интернет и попробуйте ещё раз.</p>
    <button onclick="location.reload()">Повторить</button>
  </main>
</body>
</html>
